<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Chi Zhang</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8f6f1;
      --ink: #26221d;
      --muted: #766d62;
      --line: #ded6ca;
      --link: #6f42c1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171514;
        --ink: #f4efe7;
        --muted: #b8ad9f;
        --line: #37302a;
        --link: #b999ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      line-height: 1.55;
    }

    main {
      width: min(680px, calc(100vw - 48px));
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 42px 0 46px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 14px;
      font-size: 1.12rem;
      color: var(--muted);
    }

    a {
      color: var(--link);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Chi Zhang</h1>
    <p>This personal website is temporarily offline.</p>
    <p>Please check back later, or reach me through my <a href="https://scholar.google.com/citations?user=5JMU5XkAAAAJ&hl=en">Google Scholar profile</a>.</p>
  </main>
</body>
</html>
